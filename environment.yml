# Conda environment for neuralgeom.
#
# numpy is pinned <2 because geomstats (2.8.0) imports np.trapz, which numpy 2.0
# removed, and declares no upper bound on numpy. The pip section carries the
# packages without reliable conda-forge builds.
name: neuralgeom
channels:
  - conda-forge
dependencies:
  - python>=3.10
  # --- core ---
  - numpy>=1.23,<2
  - scipy>=1.10
  - scikit-learn>=1.3
  - h5py>=3.7
  - matplotlib>=3.6
  - pytorch>=2.0          # core: geometry / dynamics / tasks
  # --- optional: closed-form manifold geometry (subspace analyses) ---
  - geomstats>=2.7
  # --- optional: PDF reports ---
  - reportlab>=4.0
  - pillow>=9.0
  # --- optional: run the example notebooks ---
  - ipykernel
  - jupyterlab
  - pip
  - pip:
      # optional: persistent homology
      - ripser>=0.6
      - persim>=0.3
      # optional: discrete exterior calculus (the PyPI package 'pydec' is unrelated)
      - dxtr
      - pypdf>=3.0
      # --- development ---
      - pytest>=7
