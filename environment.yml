# Conda environment for neuralgeom (the unified geometry+topology library).
#
# The pinned numpy<2 is required by the optional geometry/topology stack
# (geomstats, ripser). Torch is core (the pullback/dynamics engine needs it).
# The pip section carries the packages without reliable conda-forge builds.
name: neuralgeom
channels:
  - conda-forge
dependencies:
  - python>=3.10
  # --- core ---
  - numpy>=1.23,<2
  - scipy>=1.10
  - scikit-learn>=1.3
  - h5py>=3.7
  - matplotlib>=3.6
  - pytorch>=2.0          # core: pullback / dynamics / tasks engine
  # --- optional: closed-form manifold geometry (subspace lens) ---
  - geomstats>=2.7
  # --- optional: PDF reports ---
  - reportlab>=4.0
  - pillow>=9.0
  # --- optional: run the example notebooks ---
  - ipykernel
  - jupyterlab
  - pip
  - pip:
      # optional: persistent homology (topology lens)
      - ripser>=0.6
      - persim>=0.3
      # optional: discrete exterior calculus (NOT 'pydec' — that is unrelated)
      - dxtr
      - pypdf>=3.0
      # optional: neurogym task adapter
      - neurogym>=2.0
      - gymnasium>=0.29
